alerts:
  - name: Chat latency high
    severity: critical
    condition: 'P95(response_sent.latency_ms) > 2000 ms over request_received traffic'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: llmops-on-call
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: Chat request error rate
    severity: critical
    condition: 'request_failed / request_received > 2%'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: api-on-call
    minimum_samples: 20
    runbook: docs/alerts.md#alert-2
  - name: Retrieval success degradation
    severity: warning
    condition: 'tool_success == true / non-null tool_success < 90%'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#llmops-alerts'
    owner: retrieval-on-call
    minimum_samples: 10
    runbook: docs/alerts.md#alert-3
